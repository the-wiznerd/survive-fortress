<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survive!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      height: 100%;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
    }

    #game-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      image-rendering: pixelated;
    }

    #sidebar {
      width: 280px;
      padding: 1.5rem;
      background: #16213e;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }

    #sidebar h1,
    #sidebar h2 {
      color: #87ceeb;
      margin-bottom: 0.5em;
      font-size: 14px;
    }

    #sidebar .label {
      color: #888;
    }

    #sidebar .section {
      margin-top: 16px;
    }

    .entity-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .entity-card-label {
      color: #87ceeb;
      font-weight: bold;
      font-size: 13px;
      text-transform: capitalize;
    }

    .entity-card-traits:empty {
      display: none;
    }

    .entity-card-traits {
      margin-top: 4px;
    }

    .stat-text {
      display: flex;
      justify-content: space-between;
      padding: 1px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    .stat-text .label {
      color: #888;
    }

    .stat-text .value {
      color: #e0e0e0;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
  </div>
  <div id="sidebar">
    <h1>Survive Fortress</h1>

    <div class="section">
      <div class="stat"><span class="label">Day:</span> {{ store.day }}.{{ store.tickOfDay }}</div>
    </div>

    <div v-if="store.player" class="section">
      <div class="entity-card">
        <div class="entity-card-label">{{ store.player.label }}</div>
        <div v-if="store.player.traits.length" class="entity-card-traits">
          <div v-for="t in store.player.traits" :key="t.label" class="stat-text">
            <span class="label">{{ t.label }}</span>
            <span class="value">{{ t.value }}</span>
          </div>
        </div>
      </div>
    </div>

    <div v-if="store.selection" class="section">
      <h2>Tile ({{ store.selection.x }}, {{ store.selection.y }})</h2>
      <div v-if="store.selection.entities.length === 0" class="stat">Empty</div>
      <div v-for="e in store.selection.entities" :key="e.id" class="entity-card">
        <div class="entity-card-label">{{ e.label }}</div>
        <div v-if="e.traits.length" class="entity-card-traits">
          <div v-for="t in e.traits" :key="t.label" class="stat-text">
            <span class="label">{{ t.label }}</span>
            <span class="value">{{ t.value }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
